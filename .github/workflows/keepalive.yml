name: keepalive

# Scheduled workflows on public repos are disabled after 60 days without repository
# activity. The daily commits normally reset that clock; this is insurance for a
# stretch where nothing changes.
on:
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true

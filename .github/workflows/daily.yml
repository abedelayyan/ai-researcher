name: daily

# arXiv announces new submissions at roughly 20:00 ET. Cron is UTC and does not shift
# with daylight saving, so 02:17 UTC lands at 21:17 EST in winter and 22:17 EDT in
# summer, comfortably after the announcement either way. The minute is offset from the
# top of the hour because scheduled workflows bunch there and get delayed. A late or
# missed run is fine: the pipeline widens its lookback window to cover what it missed.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Run date (YYYY-MM-DD), defaults to today"
        required: false
      lookback_hours:
        description: "Override the ingest window"
        required: false
      limit:
        description: "Cap papers scored, for a quick test run"
        required: false

permissions:
  contents: write
  models: read          # free GitHub Models inference for the cheap tier

concurrency:
  group: signal-zero-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore API response cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: signal-zero-http-${{ github.run_id }}
          restore-keys: signal-zero-http-

      - name: Run the daily pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Set as a repository variable to join OpenAlex's polite pool.
          SIGNAL_ZERO_CONTACT: ${{ vars.SIGNAL_ZERO_CONTACT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          # Dispatch inputs reach the shell as environment variables rather than being
          # interpolated into the script, which is what stops one becoming a command.
          RUN_DATE: ${{ inputs.date }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
          PAPER_LIMIT: ${{ inputs.limit }}
        run: |
          args=()
          if [ -n "$RUN_DATE" ]; then args+=(--date "$RUN_DATE"); fi
          if [ -n "$LOOKBACK_HOURS" ]; then args+=(--lookback-hours "$LOOKBACK_HOURS"); fi
          if [ -n "$PAPER_LIMIT" ]; then args+=(--limit "$PAPER_LIMIT"); fi
          python -m src.cli daily "${args[@]}"

      - name: Commit the digest, the database and the spend log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "digest: daily run"
          file_pattern: data/signal.db data/digest/*.md data/costs/*.jsonl site/**

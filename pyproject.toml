[project]
name = "signal-zero"
version = "0.1.0"
description = "Day-zero forecasting scorer for new AI papers, with a public prediction log."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are caught by the formatter, not worth failing CI over
